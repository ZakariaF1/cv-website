<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Threat model - visitor loads site and resume</title>
  <desc id="desc">Trust boundaries for a public visitor loading the portfolio over HTTPS and downloading the resume PDF. Surfaces: browser, Cloudflare edge, Vercel origin, third-party CDNs, GitHub deploy path.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="threat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg)"/>
  <text x="40" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Threat model - visitor loads site / resume</text>
  <text x="40" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Use case: public GET of HTML/JS/CSS/media and /ZakariaAhmadResume.pdf over HTTPS</text>

  <!-- Trust boundary box -->
  <rect x="220" y="100" width="520" height="280" rx="18" fill="#fff7ed" fill-opacity="0.45" stroke="#f97316" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="240" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c2410c">Trust boundary - proxied production edge</text>

  <!-- Visitor -->
  <g filter="url(#soft)">
    <rect x="40" y="180" width="140" height="90" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="110" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Visitor</text>
  <text x="110" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Browser</text>

  <line x1="180" y1="225" x2="248" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="214" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">HTTPS</text>

  <!-- Cloudflare -->
  <g filter="url(#soft)">
    <rect x="260" y="160" width="180" height="130" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="350" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">Cloudflare</text>
  <text x="350" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">TLS / CDN / RUM</text>
  <text x="350" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">DoS absorption</text>
  <text x="350" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Cache HIT for media</text>

  <line x1="440" y1="225" x2="508" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="474" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">origin</text>

  <!-- Vercel -->
  <g filter="url(#soft)">
    <rect x="520" y="160" width="180" height="130" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="610" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Vercel</text>
  <text x="610" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Static SPA + PDF</text>
  <text x="610" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Integrity via Git deploy</text>
  <text x="610" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">No app secrets</text>

  <!-- Third parties -->
  <g filter="url(#soft)">
    <rect x="760" y="120" width="160" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="840" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Third-party CDNs</text>
  <text x="840" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Google Fonts</text>
  <text x="840" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">jsDelivr icons</text>

  <line x1="700" y1="180" x2="758" y2="160" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="720" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b21b6">supply chain</text>

  <!-- GitHub -->
  <g filter="url(#soft)">
    <rect x="760" y="260" width="160" height="90" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="840" y="295" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="840" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">CI lint/test/build</text>
  <text x="840" y="336" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Push to main -&gt; deploy</text>

  <line x1="700" y1="260" x2="758" y2="290" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="708" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">integrity path</text>

  <!-- Threat callouts -->
  <g filter="url(#soft)">
    <rect x="40" y="400" width="880" height="90" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  </g>
  <text x="60" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Primary threats (see STRIDE table in ARD)</text>
  <text x="60" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">DoS / scrape at edge - Tampering of deploy or cache - XSS in browser - Third-party script/font compromise - Accidental secret in git</text>
  <text x="60" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Mitigations: Cloudflare + Full strict TLS, GitHub CI + lockfile, React escaping, no login surface, UptimeRobot, runbook rollback/purge</text>
</svg>
