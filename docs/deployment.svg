<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Deployment  zakariaahmad.site</title>
  <desc id="desc">Visitor requests go through Cloudflare CDN to Vercel origin. Namecheap is registrar only. UptimeRobot monitors HTTPS.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Deployment  zakariaahmad.site</text>
  <text x="40" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Namecheap ’ Cloudflare (DNS + CDN) ’ Vercel origin · HTTPS Full (strict)</text>

  <!-- Visitor -->
  <g filter="url(#soft)">
    <rect x="40" y="140" width="150" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <circle cx="115" cy="172" r="18" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="115" cy="166" r="7" fill="#64748b"/>
  <path d="M100 190c0-8 7-14 15-14s15 6 15 14" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="115" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Visitor</text>
  <text x="115" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Browser</text>

  <!-- Arrow visitor ’ Cloudflare -->
  <line x1="190" y1="190" x2="268" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="229" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">HTTPS</text>

  <!-- Cloudflare -->
  <g filter="url(#soft)">
    <rect x="280" y="120" width="200" height="140" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  </g>
  <rect x="280" y="120" width="200" height="34" rx="14" fill="#fff7ed"/>
  <rect x="280" y="140" width="200" height="14" fill="#fff7ed"/>
  <text x="380" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">Cloudflare</text>
  <text x="380" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">DNS · CDN proxy</text>
  <text x="380" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">TLS termination</text>
  <text x="380" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Automatic RUM</text>
  <text x="380" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Edge cache (HIT)</text>

  <!-- Arrow Cloudflare ’ Vercel -->
  <line x1="480" y1="190" x2="558" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="519" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Full strict</text>

  <!-- Vercel -->
  <g filter="url(#soft)">
    <rect x="570" y="120" width="200" height="140" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
  <rect x="570" y="120" width="200" height="34" rx="14" fill="#0f172a"/>
  <rect x="570" y="140" width="200" height="14" fill="#0f172a"/>
  <text x="670" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Vercel</text>
  <text x="670" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Origin host</text>
  <text x="670" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Static SPA (dist/)</text>
  <text x="670" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">vercel.json headers</text>
  <text x="670" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Git deploy from main</text>

  <!-- Namecheap -->
  <g filter="url(#soft)">
    <rect x="280" y="320" width="200" height="72" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="380" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Namecheap</text>
  <text x="380" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Registrar · NS ’ Cloudflare</text>

  <!-- Arrow Namecheap ’ Cloudflare -->
  <line x1="380" y1="320" x2="380" y2="268" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="398" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">nameservers</text>

  <!-- UptimeRobot -->
  <g filter="url(#soft)">
    <rect x="570" y="320" width="200" height="72" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  </g>
  <text x="670" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1">UptimeRobot</text>
  <text x="670" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">HTTPS poll every 5 min</text>

  <!-- Monitor arrow -->
  <path d="M670 320 V 280 H 480" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="560" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0369a1">monitor www</text>

  <!-- Legend -->
  <text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Solid = request path · Dashed = DNS / monitoring · Live: www.zakariaahmad.site</text>
</svg>
